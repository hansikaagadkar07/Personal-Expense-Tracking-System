{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1>Create your account</h1><p>Register to create your private expense-tracking profile.</p>
<form method="post">
<div class="field"><label for="name">Full name</label><input id="name" name="name" maxlength="100" required autocomplete="name"></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" maxlength="150" required autocomplete="email"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" name="password" minlength="8" required autocomplete="new-password"></div>
<div class="field"><label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></div>
<button type="submit">Create account</button></form>
<div class="auth-foot">Already registered? <a href="/login">Log in</a></div>
{% endblock %}
